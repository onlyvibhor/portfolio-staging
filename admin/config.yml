backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/portfolio
  branch: main
local_backend: true
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://YOUR-SITE.netlify.app
display_url: https://YOUR-SITE.netlify.app
collections:
- name: projects
  label: Projects (case studies)
  label_singular: Project
  folder: content/projects
  extension: json
  format: json
  create: true
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}} ({{year}}) {{published}}'
  sortable_fields:
  - order
  - title
  - year
  fields:
  - label: Title
    name: title
    widget: string
    hint: Full project name, used in the page title and SEO.
  - label: URL slug
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - Lowercase letters, numbers and hyphens only
    hint: 'Page URL: case.html?c=<slug>. Do not change after publishing.'
  - label: Published
    name: published
    widget: boolean
    default: false
    hint: Off = draft. Drafts are hidden from the site.
  - label: Featured on home page
    name: featured
    widget: boolean
    default: false
  - label: Order
    name: order
    widget: number
    value_type: int
    min: 1
    default: 10
    hint: Lower numbers come first on the home page and in 'Next project'.
  - label: Big title (case page; one line per row)
    name: title_lines
    widget: text
    hint: Case page headline, one line per row (e.g. 'Break' then 'To Build'). Not needed for external-link projects.
    required: false
  - label: Card title (home gallery)
    name: card_title
    widget: text
    required: false
    hint: Defaults to the big title.
  - label: Client
    name: client
    widget: string
    required: false
  - label: Year
    name: year
    widget: string
    required: false
  - label: Category
    name: category
    widget: string
    hint: A short descriptor shown on the case page, e.g. 'AI film · Campaign'.
    required: false
  - label: Your role
    name: role
    widget: string
    required: false
  - label: Categories
    name: categories
    widget: list
    min: 1
    hint: 'Drives the filter chips on the Work page. Suggested: AI Film, Campaign, Video, Landing Page / Web, Brand & Identity,
      Social, Print. Any new name becomes a new filter automatically.'
    field:
      label: Category
      name: category
      widget: string
  - label: Tagline
    name: tagline
    widget: text
    hint: One strong sentence. Shown large under the cover.
    required: false
  - label: Summary
    name: summary
    widget: text
    required: false
    hint: One or two sentences, used for SEO and sharing.
  - label: Cover
    name: cover
    widget: object
    fields:
    - label: Cover image
      name: image
      widget: image
      required: false
      hint: JPG, 2400px wide max, under 600 KB. Landscape (16:9 to 16:10) works best.
    - label: Cover video (optional)
      name: video
      widget: file
      required: false
      hint: MP4 (H.264), muted loop, 1280-1920px wide, under 8 MB. Plays instead of the image.
  - label: Headline metrics
    name: metrics
    widget: list
    required: false
    summary: '{{fields.value}} {{fields.label}}'
    hint: Shown big under the tagline and counted up on scroll. 3 to 5 works best.
    fields:
    - label: Value
      name: value
      widget: string
      hint: e.g. 2.1M+ or 13% or 81
    - label: Label
      name: label
      widget: string
  - label: Case study sections
    name: sections
    widget: list
    required: false
    hint: Build the story with blocks, in order. Add as many as you need.
    types:
    - label: Text
      name: text
      widget: object
      summary: 'Text: {{fields.label}} - {{fields.title}}'
      fields:
      - label: Small label
        name: label
        widget: string
        required: false
        hint: e.g. The brief, The insight
      - label: Heading
        name: title
        widget: text
        required: false
      - label: Body
        name: body
        widget: markdown
        required: false
        buttons:
        - bold
        - italic
        - link
        - bulleted-list
        - numbered-list
    - label: Big statement
      name: statement
      widget: object
      summary: 'Statement: {{fields.text}}'
      fields:
      - label: Statement
        name: text
        widget: text
        hint: One huge sentence that reveals word by word.
    - label: Image
      name: image
      widget: object
      summary: 'Image: {{fields.caption}}'
      fields:
      - label: Image
        name: image
        widget: image
      - label: Caption
        name: caption
        widget: string
        required: false
      - label: Size
        name: size
        widget: select
        options:
        - full
        - wide
        - narrow
        default: wide
        hint: full = edge to edge, wide = large, narrow = portrait/tall images
    - label: Image grid
      name: image_grid
      widget: object
      summary: 'Grid: {{fields.images.length}} images'
      fields:
      - label: Columns (desktop)
        name: columns
        widget: select
        options:
        - '1'
        - '2'
        - '3'
        default: '2'
      - label: Images
        name: images
        widget: list
        summary: '{{fields.caption}}'
        fields:
        - label: Image
          name: image
          widget: image
        - label: Caption
          name: caption
          widget: string
          required: false
    - label: Video
      name: video
      widget: object
      summary: 'Video: {{fields.caption}}'
      fields:
      - label: Video URL
        name: url
        widget: string
        hint: YouTube or Vimeo link, or the path to an MP4 you uploaded.
      - label: Poster image (optional)
        name: poster
        widget: image
        required: false
      - label: Caption
        name: caption
        widget: string
        required: false
      - label: Size
        name: size
        widget: select
        options:
        - full
        - wide
        default: wide
      - label: Silent loop (autoplay, muted)
        name: loop
        widget: boolean
        default: false
        required: false
        hint: 'Use for short MP4 clips: they loop without controls.'
      - label: Aspect ratio (optional)
        name: ratio
        widget: string
        required: false
        hint: For files that are not 16:9, e.g. 1276/718 or 4/5. Use width/height.
    - label: Process steps
      name: steps
      widget: object
      summary: 'Steps: {{fields.label}} ({{fields.items.length}})'
      fields:
      - label: Small label
        name: label
        widget: string
        required: false
      - label: Heading
        name: title
        widget: text
        required: false
      - label: Steps
        name: items
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Step title
          name: title
          widget: string
        - label: Description
          name: body
          widget: text
        - label: Tools used
          name: tools
          widget: string
          required: false
    - label: Tools / stack
      name: tools
      widget: object
      summary: 'Tools: {{fields.label}}'
      fields:
      - label: Small label
        name: label
        widget: string
        required: false
      - label: Tools
        name: items
        widget: list
        field:
          label: Tool
          name: tool
          widget: string
    - label: Metrics
      name: metrics
      widget: object
      summary: 'Metrics: {{fields.label}}'
      fields:
      - label: Small label
        name: label
        widget: string
        required: false
      - label: Numbers
        name: items
        widget: list
        summary: '{{fields.value}} {{fields.label}}'
        fields:
        - label: Value
          name: value
          widget: string
        - label: Label
          name: label
          widget: string
    - label: Quote
      name: quote
      widget: object
      summary: 'Quote: {{fields.who}}'
      fields:
      - label: Quote
        name: text
        widget: text
      - label: Who said it
        name: who
        widget: string
        required: false
    - label: Looping clips
      name: clips
      widget: object
      summary: 'Clips: {{fields.columns}} columns'
      fields:
      - label: Columns
        name: columns
        widget: select
        options:
        - '1'
        - '2'
        - '3'
        default: '2'
      - label: Clips
        name: clips
        widget: list
        fields:
        - label: MP4 file
          name: video
          widget: file
        - label: Poster image (optional)
          name: poster
          widget: image
          required: false
        - label: Caption
          name: caption
          widget: string
          required: false
        summary: '{{fields.caption}}'
        hint: Short silent MP4 loops (under 1.5 MB each work best).
    - &id001
      label: Before / after slider
      name: compare
      widget: object
      summary: 'Compare: {{fields.before_label}} / {{fields.after_label}}'
      fields:
      - label: Before image
        name: before
        widget: image
      - label: After image
        name: after
        widget: image
      - label: Before label
        name: before_label
        widget: string
        required: false
      - label: After label
        name: after_label
        widget: string
        required: false
      - label: Aspect ratio (width/height)
        name: ratio
        widget: string
        required: false
        hint: e.g. 3/4 or 16/9. Both images are cropped to fit.
      - label: Caption
        name: caption
        widget: string
        required: false
      - label: Size
        name: size
        widget: select
        options:
        - narrow
        - wide
        default: narrow
    - &id002
      label: Video grid (YouTube / Vimeo)
      name: video_grid
      widget: object
      summary: 'Videos: {{fields.columns}} columns'
      fields:
      - label: Columns
        name: columns
        widget: select
        options:
        - '1'
        - '2'
        - '3'
        default: '2'
      - label: Videos
        name: videos
        widget: list
        summary: '{{fields.caption}}'
        fields:
        - label: Video URL
          name: url
          widget: string
        - label: Poster image (optional)
          name: poster
          widget: image
          required: false
        - label: Caption
          name: caption
          widget: string
          required: false
  - label: Team and credits
    name: team
    widget: list
    required: false
    summary: '{{fields.name}} {{fields.role}}'
    fields:
    - label: Name
      name: name
      widget: string
    - label: Role
      name: role
      widget: string
      required: false
  - label: Awards and recognition
    name: awards
    widget: list
    required: false
    summary: '{{fields.title}}: {{fields.detail}}'
    fields:
    - label: Award
      name: title
      widget: string
    - label: Detail
      name: detail
      widget: string
      required: false
  - label: Links
    name: links
    widget: list
    required: false
    summary: '{{fields.label}}'
    fields:
    - label: Label
      name: label
      widget: string
    - label: URL
      name: url
      widget: string
